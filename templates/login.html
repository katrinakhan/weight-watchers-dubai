{% extends "base.html" %}
{% block title %}Log in — What to Order{% endblock %}
{% block content %}
<article class="auth">
    <h1>Log in</h1>
    <p class="lede">Clients use the email and password they registered with. Then the restaurant guides open.</p>
    {% if error %}
    <p class="auth-error">{{ error }}</p>
    {% endif %}
    <form class="auth-form" method="post">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required autocomplete="email">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required autocomplete="current-password">
        <button type="submit">Log in</button>
    </form>
    <p class="auth-switch">New client? <a href="{{ url_for('register') }}">Create an account</a></p>
</article>
{% endblock %}
